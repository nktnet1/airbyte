api_budget:
  type: HTTPAPIBudget
  policies:
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: "{{ config['sessions_rate_limit_calls'] }}"
          interval: PT5M
      matchers:
        - method: POST
          url_path_pattern: ^/publisher_api/v1/customers/[^/]+/tokenized_url/?$
    - type: MovingWindowCallRatePolicy
      rates:
        - limit: "{{ config['general_rate_limit_calls'] }}"
          interval: PT1M
      matchers:
        - url_path_pattern: ^/publisher_api/v1(?:/|$)
  status_codes_for_ratelimit_hit:
    - 429
