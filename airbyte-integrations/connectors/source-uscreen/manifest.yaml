    name: customers
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: CustomRequester
        class_name: source_declarative_manifest.components.UscreenHttpRequester
        url: https://www.uscreen.io/publisher_api/v1/customers
        use_cache: true
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        request_parameters:
          $ref: "#/definitions/linked/HttpRequester/request_parameters"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type:
              - "null"
              - integer
            description: Uscreen system ID
          name:
            type:
              - "null"
              - string
