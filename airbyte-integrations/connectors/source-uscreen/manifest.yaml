version: 7.23.7

type: DeclarativeSource

description: >-
  Extracts customers, subscriptions, access records, groups, invoices, offers,
  content and user/content view analytics from the Uscreen Publisher API.

check:
  type: CheckStream
  stream_names:
    - customers

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: ApiKeyAuthenticator
        api_token: "{{ config['api_key'] }}"
        inject_into:
          type: RequestOption
          field_name: Authorization
          inject_into: header
      error_handler:
        type: DefaultErrorHandler
        response_filters:
          - type: HttpResponseFilter
            action: FAIL
            http_codes:
              - 401
              - 403
            failure_type: config_error
            error_message: >-
              Uscreen rejected the API key. Check that the Publisher API key is
              valid and has access to this store.
          - type: HttpResponseFilter
            action: FAIL
            http_codes:
              - 422
            failure_type: config_error
            error_message: >-
              Uscreen rejected a request parameter or date range. Check the
              optional From/To dates.
      request_headers:
        Accept: application/json
      request_parameters: >-
        {{ {'from': config.get('start_date'), 'to': config.get('end_date')} if
        config.get('start_date') and config.get('end_date') else {'from':
        config.get('start_date')} if config.get('start_date') else {'to':
        config.get('end_date')} if config.get('end_date') else {} }}
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          field_name: page
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          cursor_value: >-
            {{ headers.get('link', {}).get('next', {}).get('url', '') |
            regex_search('[?&]page=([^&]+)') }}

streams:
